<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script><title>ICT 10</title>
    <style>
        body {
            text-align: center;
            background-image: url('https://www.animationsoftware7.com/img/agifs/fire01.gif');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            color: rgb(4, 50, 136);
        }

        #form-container {
            width: min(100%, 560px);
            border: 5px solid rgb(17, 20, 193);
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            font-size: 20px;
        }

        .info-box {
            text-align: left;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 2px solid rgba(17, 20, 193, 0.2);
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div id="form-container">
            <h1>Non-Metal Elements</h1>
            <form class="text-start">
              <label for="nonmets" class="form-label fw-bold">Please Enter Element Name</label>
              <input type="text" id="nonmets" class="form-control mb-3" placeholder="E.G: Xenon, Argon">
                <button type="button" class="btn btn-primary w-100" py-click="locate_element">Find Element</button>
            </form>

            <div class="result mt-3"></div>

            <div class="info-box">
                <h3>Information Database</h3>
                <p><b>Symbol:</b> <span id="data_symbol"></span></p>
                <p><b>Proper Name:</b> <span id="data_name"></span></p>
                <p><b>Atomic Number:</b> <span id="data_number"></span></p>
                <p><b>Atomic Weight:</b> <span id="data_weight"></span></p>
            </div>
        </div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
